app:
  name: "WhatsApp Business Bot"
  timezone: "Asia/Shanghai"

business:
  owner_name: "Grant"
  company_name: "WhatsApp-bot"
  quiet_hours_start: 21
  quiet_hours_end: 8
  max_auto_replies_per_hour: 30
  min_delay_between_messages_seconds: 60

ai:
  provider: openai_compatible
  model: deepseek-chat
  base_url: https://api.deepseek.com
  max_context_messages: 20
  reply_max_length: 800
  reply_cooldown_minutes: 1

scheduler:
  followup_check_interval_minutes: 5
  default_followup_days: 7

database:
  path: "./data/customers.db"

bridge:
  port: 3001
  host: "127.0.0.1"

api:
  host: "0.0.0.0"
  port: 8000
