name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows Build ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Python backend (PyInstaller)
        run: pyinstaller backend.spec --distpath dist --workpath build --clean

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer (NSIS)
        working-directory: desktop
        run: npx electron-builder --win

      - name: Rename installer for release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/dist
        run: |
          $file = Get-ChildItem -Filter "WhatsApp-机器人 Setup *.exe" | Select-Object -First 1
          Rename-Item -Path $file.FullName -NewName "WhatsApp-Bot-Windows-Setup.exe"

      - name: Upload Windows installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: desktop/dist/WhatsApp-机器人 Setup *.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/WhatsApp-Bot-Windows-Setup.exe

  # ── Mac Build ──
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Python backend (PyInstaller)
        run: pyinstaller backend.spec --distpath dist --workpath build --clean

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build Mac DMG
        working-directory: desktop
        run: npx electron-builder --mac

      - name: Rename DMG for release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/dist
        run: |
          file=$(ls WhatsApp-机器人-*.dmg 2>/dev/null | head -1)
          mv "$file" "WhatsApp-Bot-macOS.dmg"

      - name: Upload Mac DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Mac-DMG
          path: desktop/dist/WhatsApp-机器人-*.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/WhatsApp-Bot-macOS.dmg
