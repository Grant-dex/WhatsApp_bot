<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp-bot · 销售工作台</title><style>
:root{--ink:#14282c;--muted:#78909f;--teal:#008891;--line:#e1ebef;--bg:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #28bfc7;outline-offset:3px}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}aside{position:fixed;inset:0 auto 0 0;width:254px;background:#12272a;color:#d8e8ee;display:flex;flex-direction:column;padding:26px 13px 30px}.brand{display:flex;gap:17px;align-items:center;padding:0 13px 28px}.brand svg{width:30px;height:46px;fill:#00cdd1;stroke:none}.brand strong{font-size:23px;color:#f5fafa;white-space:nowrap}.brand small{display:block;font-size:17px;color:#bed2da}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:20px;padding:15px 18px;text-align:left;border-radius:7px;font-size:18px;min-height:55px}.nav button:hover{background:#ffffff0a}.nav button.active{background:linear-gradient(100deg,#087f88,#006c77);color:#fff}.nav svg{width:25px;height:25px}.group{margin:24px 13px 10px;border-top:1px solid #39565b;padding-top:20px;color:#b5ccd3;font-size:14px}.aside-bottom{margin:auto 13px 0;padding-top:19px;border-top:1px solid #39565b}.pause{display:flex;align-items:center;gap:14px}.pause-icon{width:30px;height:30px;border-radius:50%;background:#f2f6f7;color:#29434a;display:grid;place-items:center;font-weight:800}.pause-label{flex:1}.pause-label strong{font-size:16px;color:white;font-weight:600}.pause-label small{display:block;color:#bbd0d9;font-size:14px}.switch{border:0;width:49px;height:28px;border-radius:20px;background:#829098;padding:3px;flex:none}.switch:before{content:"";display:block;width:22px;height:22px;background:white;border-radius:50%;box-shadow:0 1px 3px #0004;transition:transform .2s}.switch[aria-checked=true]{background:#079e9e}.switch[aria-checked=true]:before{transform:translateX(21px)}.connection{margin-top:10px;font-size:14px;display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;flex:none}.connection .dot{color:#00d791;width:12px;height:12px}main{margin-left:254px;padding:24px 28px 15px}header{display:flex;justify-content:space-between;align-items:flex-start;min-height:97px}h1{font-size:36px;letter-spacing:1px;line-height:1.3;margin:0 0 6px;font-weight:750}header p{margin:0;color:var(--muted);font-size:18px}.meta{display:flex;align-items:center;gap:13px;padding-top:12px;font-size:16px}.meta time{padding-right:21px;border-right:1px solid #dae6eb}.badge-b{background:#e0f6f2;color:#009878;border-radius:9px;padding:5px 12px;font-weight:600}.demo{border:1px solid #bde6e7;background:#e4f7f6;color:#07838b;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600}.stats{display:grid;grid-template-columns:1fr 1.03fr 1.03fr 1.08fr 1.14fr 1.03fr;gap:10px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:9px;min-width:0;height:156px;padding:22px 20px 17px}.stat-top{display:flex;align-items:center;gap:16px;white-space:nowrap;color:#344e60;font-size:14px}.stat svg{color:var(--teal);width:29px;height:29px;stroke-width:2.1}.value{font-size:33px;font-weight:700;line-height:1.3;margin:14px 0 10px;letter-spacing:-.6px}.value.teal{color:var(--teal);font-size:31px}.stat small{display:block;white-space:nowrap;color:#77909f;font-size:13px}.stat small.danger{color:#ff2935}.stat:nth-child(4) small{font-size:12px}.middle{display:grid;grid-template-columns:1.8fr 1fr;gap:14px;margin-bottom:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px 17px 15px;min-width:0}h2{font-size:20px;line-height:29px;margin:0 4px 12px;font-weight:650}.table-wrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;text-align:left;white-space:nowrap;font-size:15px;color:#344b64}th{background:#f0f5f7;font-weight:500;color:#506a7d;height:42px;font-size:14px;padding:0 15px}th:first-child{border-radius:5px 0 0 5px}th:last-child{border-radius:0 5px 5px 0}td{height:54px;padding:6px 12px;border-bottom:1px solid #e6edf1}tr:last-child td{border:0}.person{display:flex;align-items:center;gap:18px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:550;flex:none;background:#e3f0ff;color:#0065bb}.purple{background:#f0e5ff;color:#6a29b5}.orange{background:#ffe8df;color:#af381b}.mint{background:#def7ee;color:#008460}.blue{background:#e3ecff;color:#1854cf}.customer{border:0;background:none;color:inherit;padding:0;text-align:left}.customer:hover .name{color:#008891}.tag{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:4px 12px;font-size:14px;line-height:21px;background:#e2f8ef;color:#009164}.tag.red{background:#ffe6e8;color:#f32b3b}.tag.amber{background:#fff4de;color:#ce8300}.tag.gray{background:#f0f5f7;color:#627889}.schedule td{height:72px;padding-left:15px}.schedule .tag{min-width:48px}.exceptions{padding-top:16px}.exceptions td{height:54px}.exceptions th:first-child{width:28%}.exceptions th:nth-child(2){width:23%}.exceptions th:nth-child(3){width:36%}footer{text-align:right;color:#8096a3;font-size:13px;margin-top:6px}.toast{position:fixed;bottom:24px;left:calc(50% + 127px);transform:translateX(-50%);background:#15383d;color:white;border-radius:9px;padding:13px 20px;box-shadow:0 8px 30px #132e2922;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.toast.show{opacity:1}dialog{border:1px solid var(--line);border-radius:14px;padding:28px;width:min(440px,90vw);color:var(--ink);box-shadow:0 20px 90px #14282c33}dialog::backdrop{background:#12272a66;backdrop-filter:blur(3px)}dialog h2{margin:0 0 20px}dialog p{color:#647d8b}dialog .close{float:right;border:0;background:#edf4f4;border-radius:6px;padding:4px 10px;color:#43626b}dialog dl{display:grid;grid-template-columns:90px 1fr;gap:15px;font-size:15px}dt{color:#78909f}dd{margin:0}.mobile-menu{display:none}
@media(min-width:1700px){main{padding:30px 34px}.stat{height:172px;padding:25px}header{min-height:104px}.middle{grid-template-columns:1.8fr 1fr}.panel{padding:20px}td{height:62px}.schedule td{height:82px}.exceptions td{height:62px}}

@media(max-width:1100px){aside{width:76px;padding:24px 8px}.brand{padding:0 14px 27px}.brand div,.nav button span,.group,.aside-bottom{display:none}.nav button{justify-content:center;padding:15px}.nav.system{border-top:1px solid #39565b;margin-top:20px;padding-top:16px}main{margin-left:76px}.middle{grid-template-columns:1.7fr 1fr}h1{font-size:32px}h2{font-size:18px}.toast{left:calc(50% + 38px)}}
@media(max-width:800px){main{padding:20px 16px}.middle{grid-template-columns:1fr}header{min-height:110px}.meta time,.badge-b{display:none}h1{font-size:28px}header p{font-size:15px}.stat{padding:15px 12px}.stat-top{gap:8px;font-size:12px}.stat svg{width:24px}.value{font-size:29px}.stat small,.stat:nth-child(4) small{white-space:normal;font-size:11px}.value.teal{font-size:25px}.schedule td{height:56px}table{font-size:14px}.exceptions table{min-width:620px}.stats{gap:8px}.person{gap:10px}}
@media(max-width:480px){aside{width:58px;padding:24px 4px}.brand{padding:0 9px 27px}.brand svg{width:25px}.nav button{padding:12px}main{margin-left:58px;padding:18px 12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{height:132px}.meta{padding-top:5px}.demo{font-size:11px}h1{font-size:24px}.panel{padding:13px 10px}.active-table{min-width:510px}.toast{left:50%;width:85%;text-align:center}footer{font-size:11px}}
</style></head><body>
<aside><div class="brand"><svg viewBox="0 0 32 50"><path d="M23 0 1 28h13L7 50l24-30H18Z"/></svg><div><strong>WhatsApp-bot</strong><small>销售工作台</small></div></div><nav class="nav" id="nav"></nav><div class="group">系统</div><nav class="nav system" id="system"></nav><div class="aside-bottom"><div class="pause"><span class="pause-icon">Ⅱ</span><div class="pause-label"><strong>暂停机器人</strong><small id="pause-text">未暂停</small></div><button class="switch" role="switch" aria-checked="false" aria-label="暂停机器人（演示）" id="pause"></button></div><div class="connection"><span class="dot"></span>WhatsApp 已连接</div></div></aside>
<main><header><div><h1>销售工作台</h1><p>客户与跟进概览</p></div><div class="meta"><time>2026-10-23</time><span class="badge-b">B</span><button class="demo" id="demo">演示数据</button></div></header><section class="stats" id="stats" aria-label="关键指标"></section><div class="middle"><section class="panel"><h2>最近活跃</h2><div class="table-wrap"><table class="active-table"><thead><tr><th style="width:32%">客户</th><th style="width:27%">公司</th><th style="width:22%">状态</th><th>最近联系</th></tr></thead><tbody id="customers"></tbody></table></div></section><section class="panel"><h2>即将到来的跟进计划</h2><table class="schedule"><thead><tr><th style="width:39%">日期</th><th style="width:29%">客户数</th><th>优先级</th></tr></thead><tbody><tr><td>今天</td><td>12</td><td><span class="tag red">高</span></td></tr><tr><td>明天</td><td>8</td><td><span class="tag amber">中</span></td></tr><tr><td>10月 25 日</td><td>5</td><td><span class="tag gray">常规</span></td></tr></tbody></table></section></div><section class="panel exceptions"><h2>最近发送异常</h2><div class="table-wrap"><table><thead><tr><th>客户</th><th>状态</th><th>错误信息</th><th>时间</th></tr></thead><tbody><tr><td><button class="customer" data-error="failed"><span class="person"><span class="avatar blue">DL</span><span class="name">Daniel Lee</span></span></button></td><td><span class="tag red"><i class="dot"></i>失败</span></td><td>连接超时</td><td>14:32</td></tr><tr><td><button class="customer" data-error="unknown"><span class="person"><span class="avatar purple">MS</span><span class="name">Maya Stone</span></span></button></td><td><span class="tag amber"><i class="dot"></i>待确认</span></td><td>等待发送结果确认</td><td>14:28</td></tr></tbody></table></div></section><footer>视觉设计预览 · 演示数据</footer></main><div class="toast" role="status" id="toast"></div><dialog id="detail"><button class="close" aria-label="关闭详情">×</button><div id="detail-content"></div></dialog>
<script>
const paths={home:'<path d="m3 10 9-8 9 8M5 9v12h5v-7h4v7h5V9"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M3 21v-2a7 5 0 0 1 18 0v2Z"/>',users:'<path d="M2 21v-2a6 5 0 0 1 12 0v2M16 15a5 5 0 0 1 6 5M16 3a4 4 0 0 1 0 8"/><circle cx="8" cy="7" r="4"/>',chat:'<path d="M7 19 3 22v-6a5 5 0 0 1-1-3V7a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-7Z"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 2v5M17 2v5M3 10h18m-12 5 2 2 4-4"/>',order:'<rect x="4" y="4" width="16" height="18" rx="2"/><path d="M8 2v5M16 2v5M8 12h8M8 17h6"/>',doc:'<path d="M15 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14V6ZM14 2v5h5M7 11h8M7 15h8M7 19h5"/>',link:'<path d="m10 14 4-4M8 15l-2 2a3.5 3.5 0 0 1-5-5l5-5a3.5 3.5 0 0 1 5 0m2 2 2-2a3.5 3.5 0 0 1 5 5l-5 5a3.5 3.5 0 0 1-5 0" transform="translate(1 1)"/>',log:'<path d="M4 2h16v16l-5 4H4ZM8 7h8M8 11h8M8 15h3M15 22v-5h5"/>',send:'<path d="m22 2-7 20-4-9-9-4ZM11 13 22 2"/>',reply:'<rect x="2" y="3" width="20" height="15" rx="5"/><path d="m8 18 4 4 4-4"/><circle cx="8" cy="10" r=".7"/><circle cx="16" cy="10" r=".7"/>',total:'<rect x="5" y="2" width="16" height="20" rx="1"/><path d="M2 5v17M9 7h8M9 11h8M9 15h4"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]}</svg>`;
const nav=[['home','工作台'],['user','客户管理'],['chat','对话记录'],['calendar','跟进管理'],['order','订单管理'],['doc','产品资料'],['link','桥接状态'],['log','运行日志']];nav.forEach(([i,n],j)=>document.getElementById(j<6?'nav':'system').insertAdjacentHTML('beforeend',`<button class="${j===0?'active':''}" ${j===0?'aria-current="page"':''} title="${n}" data-nav="${n}">${icon(i)}<span>${n}</span></button>`));
const stats=[['users','活跃客户','128','共 156 个客户'],['calendar','今日待跟进','12','3 个已逾期'],['reply','今日 AI 回复','24','18 条收到的消息'],['send','已发送跟进','8','今日 1 条失败 · 1 条待确认'],['link','WhatsApp 桥接','已连接','已认证'],['total','总对话数','1,286','所有客户']];document.getElementById('stats').innerHTML=stats.map(([i,l,v,s],j)=>`<article class="stat"><div class="stat-top">${icon(i)}<span>${l}</span></div><div class="value ${j===4?'teal':''}">${v}</div><small class="${j===1?'danger':''}">${s}</small></article>`).join('');
const customers=[['AC','Alex Chen','Atlas Energy','10 分钟前',''],['SS','Sofia Silva','Nova Power','35 分钟前','purple'],['OA','Omar Ali','Horizon Tech','1 小时前','orange'],['EW','Emma Wilson','Northstar','2 小时前','mint']];document.getElementById('customers').innerHTML=customers.map(([a,n,c,t,color],i)=>`<tr><td><button class="customer" data-customer="${i}"><span class="person"><span class="avatar ${color}">${a}</span><span class="name">${n}</span></span></button></td><td>${c}</td><td><span class="tag"><i class="dot"></i>活跃</span></td><td>${t}</td></tr>`).join('');
let timer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),3500)}const dialog=document.getElementById('detail');function detail(html){document.getElementById('detail-content').innerHTML=html;dialog.showModal()}document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.getElementById('pause').onclick=function(){const on=this.getAttribute('aria-checked')!=='true';this.setAttribute('aria-checked',String(on));document.getElementById('pause-text').textContent=on?'已暂停':'未暂停';toast(on?'演示：机器人已暂停':'演示：机器人已恢复')};document.getElementById('demo').onclick=()=>detail('<h2>工作台交互预览</h2><p>本页根据原版设计图制作，全部内容为演示数据，未连接真实后台。</p><p>可点击客户查看详情、查看发送异常，或切换侧栏底部的暂停开关。调整窗口大小可查看响应式布局。</p>');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='工作台'){window.scrollTo({top:0,behavior:'smooth'});return}toast(b.dataset.nav+'页面尚未接入，本次预览聚焦工作台')});document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>{const [a,n,c,t,color]=customers[Number(b.dataset.customer)];detail(`<h2 class="person"><span class="avatar ${color}">${a}</span>${n}</h2><dl><dt>公司</dt><dd>${c}</dd><dt>客户状态</dt><dd><span class="tag"><i class="dot"></i>活跃</span></dd><dt>最近联系</dt><dd>${t}</dd></dl><p>客户详情 · 演示数据</p>`)});document.querySelectorAll('[data-error]').forEach(b=>b.onclick=()=>{const failed=b.dataset.error==='failed';detail(`<h2>${failed?'Daniel Lee':'Maya Stone'} · 发送详情</h2><dl><dt>状态</dt><dd><span class="tag ${failed?'red':'amber'}">${failed?'失败':'待确认'}</span></dd><dt>时间</dt><dd>${failed?'14:32':'14:28'}</dd><dt>错误信息</dt><dd>${failed?'连接超时':'等待发送结果确认'}</dd></dl><p>${failed?'本条演示记录发送失败。':'发送结果暂未确认，不能据此判断发送失败。'} 此预览不会发送或重试消息。</p>`)});
</script></body></html>
